<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">lossless-compaction moves old tool results out of context and brings them back exactly when needed</title>
<desc id="desc">A Claude Code conversation is compacted without summaries: large tool results move to local files, compact tickets remain in context, and recall or find restores an exact result. Recorded README figures show six of twenty-one results moved in 61 milliseconds and find answering thirteen of thirteen measured questions.</desc>
<style>
:root{color-scheme:light}
.bg{fill:#f7f5ef}.ink{fill:#172326}.muted{fill:#657477}.teal{fill:#087b78}.orange{fill:#c86729}
.card{fill:#fffdf8;stroke:#d7ddd8;stroke-width:1.4}.soft{fill:#edf3f0}.ticket{fill:#e2f0ed}
.line{stroke:#c8d2ce;stroke-width:2;fill:none}.dash{stroke-dasharray:6 7}
.sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.label{font-size:12px;font-weight:750;letter-spacing:1.5px}.heading{font-size:33px;font-weight:760;letter-spacing:-.8px}
.sub{font-size:15px}.small{font-size:12px}.body{font-size:14px}.metric{font-size:18px;font-weight:720}
.result{transform-box:fill-box;transform-origin:center}.r1{animation:stash1 9s ease-in-out infinite}.r2{animation:stash2 9s ease-in-out infinite}.r3{animation:stash3 9s ease-in-out infinite}
.recall{animation:recall 9s ease-in-out infinite}.pulse{animation:pulse 9s ease-in-out infinite}
@keyframes stash1{0%,12%{transform:translate(0,0);opacity:1}30%,76%{transform:translate(435px,118px);opacity:.18}90%,100%{transform:translate(0,0);opacity:1}}
@keyframes stash2{0%,17%{transform:translate(0,0);opacity:1}35%,76%{transform:translate(435px,78px);opacity:.18}90%,100%{transform:translate(0,0);opacity:1}}
@keyframes stash3{0%,22%{transform:translate(0,0);opacity:1}40%,76%{transform:translate(435px,38px);opacity:.18}90%,100%{transform:translate(0,0);opacity:1}}
@keyframes recall{0%,48%{opacity:.2;transform:translateX(0)}62%,76%{opacity:1;transform:translateX(0)}90%,100%{opacity:.2;transform:translateX(0)}}
@keyframes pulse{0%,50%,100%{opacity:.35}62%,78%{opacity:1}}
@media (prefers-reduced-motion:reduce){.r1,.r2,.r3,.recall,.pulse{animation:none}}
</style>

<rect class="bg" width="1200" height="560" rx="22"/>
<g class="sans">
  <text x="54" y="58" class="teal label">LOSSLESS-COMPACTION · CLAUDE CODE PLUGIN</text>
  <text x="54" y="101" class="ink heading">Move context out. Bring the exact result back.</text>
  <text x="54" y="130" class="muted sub">No summary. No deletion. Old tool output becomes local files; lightweight tickets stay in the conversation.</text>

  <!-- conversation -->
  <g transform="translate(54 170)">
    <rect class="card" width="365" height="280" rx="14"/>
    <rect class="soft" x="1" y="1" width="363" height="44" rx="13"/>
    <text x="22" y="28" class="ink label">CONVERSATION CONTEXT</text>
    <text x="340" y="28" text-anchor="end" class="muted small mono">before /compact</text>

    <rect x="22" y="66" width="321" height="38" rx="8" fill="#f6f1e9"/>
    <text x="38" y="90" class="ink body mono">Read src/contract.zig</text>

    <g class="result r1">
      <rect x="22" y="114" width="321" height="42" rx="8" fill="#fff0e7"/>
      <text x="38" y="140" class="orange body mono">tool result · 83,261 bytes</text>
    </g>
    <g class="result r2">
      <rect x="22" y="165" width="321" height="42" rx="8" fill="#fff0e7"/>
      <text x="38" y="191" class="orange body mono">tool result · 77,743 bytes</text>
    </g>
    <g class="result r3">
      <rect x="22" y="216" width="321" height="42" rx="8" fill="#fff0e7"/>
      <text x="38" y="242" class="orange body mono">tool result · 65,420 bytes</text>
    </g>
  </g>

  <!-- local store -->
  <g transform="translate(504 242)">
    <rect class="card" width="240" height="208" rx="14"/>
    <rect class="soft" x="1" y="1" width="238" height="44" rx="13"/>
    <text x="20" y="28" class="ink label">LOCAL STORE</text>
    <text x="20" y="76" class="muted small mono">~/.claude/lossless-compaction/</text>
    <rect x="20" y="93" width="200" height="31" rx="7" fill="#edf3f0"/>
    <text x="32" y="113" class="teal small mono">ed8701f2…e8008e3</text>
    <rect x="20" y="133" width="200" height="31" rx="7" fill="#edf3f0"/>
    <text x="32" y="153" class="teal small mono">05b8cce0…afc048b</text>
    <rect x="20" y="173" width="200" height="20" rx="6" fill="#edf3f0"/>
    <text x="120" y="188" text-anchor="middle" class="muted small">content-addressed files</text>
  </g>

  <!-- compact arrow -->
  <path d="M420 295 C452 295 469 295 493 295" class="line"/>
  <path d="M483 287 L495 295 L483 303" class="line"/>
  <text x="456" y="276" text-anchor="middle" class="muted small">move out</text>

  <!-- ticket remains -->
  <g transform="translate(785 170)">
    <rect class="card" width="361" height="280" rx="14"/>
    <rect class="ticket" x="1" y="1" width="359" height="44" rx="13"/>
    <text x="22" y="28" class="teal label">AFTER COMPACTION</text>
    <text x="338" y="28" text-anchor="end" class="muted small mono">small context</text>

    <text x="22" y="79" class="muted label">TICKET LEFT BEHIND</text>
    <rect x="22" y="94" width="317" height="70" rx="9" fill="#edf3f0"/>
    <text x="38" y="119" class="ink small mono">[moved out] Read result, 83261 bytes;</text>
    <text x="38" y="140" class="ink small mono">recall … id ed8701f2…e8008e3</text>

    <path d="M65 199 H296" class="line dash recall"/>
    <path d="M286 191 L298 199 L286 207" class="line recall"/>
    <text x="181" y="188" text-anchor="middle" class="muted small">recall by id · find by meaning</text>

    <rect x="22" y="218" width="317" height="40" rx="9" fill="#e3f1ee" class="pulse"/>
    <text x="38" y="243" class="teal body mono pulse">exact tool result restored</text>
  </g>

  <!-- return connection -->
  <path d="M744 350 C770 350 777 350 785 350" class="line recall"/>
  <path d="M776 342 L788 350 L776 358" class="line recall"/>

  <!-- metrics -->
  <g transform="translate(54 480)">
    <rect fill="#172326" width="1092" height="52" rx="12"/>
    <text x="22" y="21" fill="#9fbbb7" class="label">RECORDED README MEASUREMENTS</text>
    <text x="22" y="41" fill="#fffdf8" class="small">6 / 21 results moved · 61 ms</text>
    <text x="315" y="41" fill="#9fbbb7" class="small">·</text>
    <text x="336" y="41" fill="#fffdf8" class="small">find: 13 / 13 questions</text>
    <text x="590" y="41" fill="#9fbbb7" class="small">·</text>
    <text x="611" y="41" fill="#fffdf8" class="small">nothing deleted · no summary written</text>
  </g>
</g>
</svg>